spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/seafooddb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:seafood}
    password: ${DB_PASSWORD:seafood123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  port: 8080
jwt:
  secret: change-me-please
  expiration-ms: 3600000
