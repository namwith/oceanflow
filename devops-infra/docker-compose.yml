version: '3.9'
services:
  backend:
    build: ../backend-api
    ports:
      - '8080:8080'
    depends_on:
      - db
    environment:
      SPRING_PROFILES_ACTIVE: default
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: seafooddb
      POSTGRES_USER: seafood
      POSTGRES_PASSWORD: seafood123
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - '5432:5432'
  nginx:
    image: nginx:latest
    ports:
      - '80:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
